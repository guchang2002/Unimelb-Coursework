# Allow Fission function pods (running as fission-fetcher) to read/write
# the bluesky-jwt ConfigMap, used for JWT refresh caching to avoid
# BlueSky's createSession rate limit.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bluesky-jwt-rw
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bluesky-jwt-rw-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: fission-fetcher
    namespace: default
roleRef:
  kind: Role
  name: bluesky-jwt-rw
  apiGroup: rbac.authorization.k8s.io
