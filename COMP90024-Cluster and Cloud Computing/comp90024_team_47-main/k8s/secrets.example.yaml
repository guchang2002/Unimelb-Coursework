# Template for K8s Secrets used by Fission streaming functions.
# Copy this file, replace placeholder values, and apply:
#   cp secrets.example.yaml secrets.yaml
#   # Edit secrets.yaml with real values
#   kubectl apply -f secrets.yaml
#
# DO NOT commit secrets.yaml — it contains live credentials.
# .gitignore excludes secrets.yaml automatically.
---
apiVersion: v1
kind: Secret
metadata:
  name: mastodon-creds
  namespace: default
type: Opaque
stringData:
  MASTODON_TOKEN: "REPLACE_WITH_YOUR_MASTODON_ACCESS_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: bluesky-creds
  namespace: default
type: Opaque
stringData:
  BSKY_HANDLE: "REPLACE_WITH_HANDLE"             # e.g. yourname.bsky.social
  BSKY_APP_PASSWORD: "REPLACE_WITH_APP_PASSWORD"  # generate at bsky.app/settings/app-passwords
---
apiVersion: v1
kind: Secret
metadata:
  name: es-creds
  namespace: default
type: Opaque
stringData:
  ES_USER: "elastic"
  ES_PASSWORD: "REPLACE_WITH_ES_PASSWORD"
