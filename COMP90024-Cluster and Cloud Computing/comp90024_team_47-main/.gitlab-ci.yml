stages:
  - test
  - build
  - deploy

# ============================================================
# Stage 1: Unit tests (from feature/automated-testing)
# ============================================================
python_unit_tests:
  stage: test
  image: python:3.11-slim
  cache:
    key: pip-$CI_JOB_IMAGE
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install --cache-dir .cache/pip pytest fastapi httpx elasticsearch vaderSentiment beautifulsoup4 requests
  script:
    - python -m pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================================
# Stage 2: Build & push Docker image
# ============================================================
docker_build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - until docker info >/dev/null 2>&1; do echo "waiting for dockerd..."; sleep 2; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/ccc-rest-api:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/ccc-rest-api:latest backend/api/
    - docker push $CI_REGISTRY_IMAGE/ccc-rest-api:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/ccc-rest-api:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================================
# Stage 3: Deploy to Kubernetes
# ============================================================
k8s_deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p $HOME/.kube
    - echo "$KUBE_CONFIG_B64" | base64 -d > $HOME/.kube/config
  script:
    - envsubst < k8s/api-deployment.yaml | kubectl apply -f -
  needs:
    - docker_build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
